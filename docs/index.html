<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дошка оголошень нерухомості</title>
<style>
  :root {
    --bg: #eef0f6;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b6b80;
    --border: #e1e2ec;
    --accent: #4338ca;
    --accent-2: #2563eb;
    --hero-fg: #ffffff;
    --new-bg: #dcfce7;
    --new-fg: #15803d;
    --fiber-bg: #dbeafe;
    --fiber-fg: #1d4ed8;
    --shadow: 0 1px 2px rgba(23,23,55,.04), 0 4px 14px rgba(23,23,55,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101018;
      --card: #1a1a26;
      --text: #f1f1f6;
      --muted: #9797ad;
      --border: #2c2c3c;
      --accent: #818cf8;
      --accent-2: #60a5fa;
      --hero-fg: #ffffff;
      --new-bg: rgba(34,197,94,.16);
      --new-fg: #4ade80;
      --fiber-bg: rgba(96,165,250,.16);
      --fiber-fg: #93c5fd;
      --shadow: 0 4px 14px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(67,56,202,.10), transparent 55%),
      radial-gradient(circle at 100% 10%, rgba(37,99,235,.08), transparent 45%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    background-image:
      radial-gradient(circle at 8% 20%, rgba(255,255,255,.10) 0, transparent 42%),
      radial-gradient(circle at 92% 85%, rgba(255,255,255,.08) 0, transparent 38%),
      linear-gradient(135deg, var(--accent), var(--accent-2));
    padding: 32px 16px 28px;
    position: relative; overflow: hidden;
  }
  .hero-inner { max-width: 780px; margin: 0 auto; text-align: center; position: relative; }

  .auth-bar { display: flex; justify-content: flex-end; align-items: center; min-height: 34px; margin-bottom: 6px; }
  .auth-user {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 6px 4px 4px;
  }
  .auth-user img { width: 24px; height: 24px; border-radius: 50%; display: block; background: rgba(255,255,255,.4); }
  .auth-user .name { font-size: 12.5px; color: #fff; font-weight: 600; }
  .auth-user button {
    background: rgba(255,255,255,.22); border: none; color: #fff;
    font-size: 11.5px; padding: 4px 11px;
  }
  .auth-user button:hover { background: rgba(255,255,255,.34); color: #fff; border-color: transparent; }

  .hero h1 {
    color: var(--hero-fg); font-size: 27px; font-weight: 800;
    letter-spacing: -.02em; line-height: 1.25; margin: 0 0 8px;
    text-shadow: 0 1px 3px rgba(0,0,0,.18);
  }

  .chat-bar { display: flex; gap: 8px; max-width: 560px; margin: 4px auto 10px; }
  .chat-bar input {
    flex: 1; min-width: 0; font: inherit; font-size: 14px;
    border: none; border-radius: 999px; padding: 11px 16px;
    background: rgba(255,255,255,.95); color: var(--text);
  }
  .chat-bar input::placeholder { color: var(--muted); }
  .chat-bar button {
    flex: none; border: none; background: rgba(255,255,255,.24); color: #fff;
    font-weight: 700; font-size: 14px; border-radius: 999px; padding: 11px 18px; cursor: pointer;
  }
  .chat-bar button:hover { background: rgba(255,255,255,.34); }
  .chat-reply {
    max-width: 560px; margin: 0 auto 10px; font-size: 13px; line-height: 1.5;
    color: #fff; background: rgba(255,255,255,.16);
    border-radius: 10px; padding: 9px 13px; text-align: left;
  }
  .chat-reply.error { background: rgba(127,29,29,.5); }

  .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 60px; }

  .bar { margin: 14px 0 16px; }
  .bar .count { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .bar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: 13px; font-weight: 600; line-height: 1.4; cursor: pointer;
    box-sizing: border-box; -webkit-appearance: none; appearance: none;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    text-decoration: none; display: inline-flex; align-items: center;
    padding: 6px 13px; border-radius: 999px; margin: 0;
    transition: border-color .15s ease, color .15s ease, background-color .15s ease;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:active { transform: translateY(1px); }

  .card {
    display: flex; align-items: stretch;
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px; margin-bottom: 10px;
    box-shadow: var(--shadow); overflow: hidden;
    transition: border-color .15s ease, opacity .15s ease, transform .15s ease;
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-1px); }
  }
  .card.seen { opacity: .55; border-left-color: var(--border); }
  .card .thumb {
    flex: 0 0 100px; width: 100px; background: var(--border);
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { flex: 1; min-width: 0; padding: 12px 14px; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .card .title { font-weight: 600; font-size: 14px; }
  .card .price { white-space: nowrap; font-weight: 700; font-size: 14px; color: var(--accent); }
  .card .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .card .when { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .card .also-on { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .card .also-on a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .card .also-on a:hover { text-decoration: underline; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .01em;
    background: var(--new-bg); color: var(--new-fg);
    border-radius: 999px; padding: 2px 7px; margin-left: 6px;
    vertical-align: middle; line-height: 1.3;
  }
  .card.seen .badge { display: none; }
  .badge.fiber { background: var(--fiber-bg); color: var(--fiber-fg); }
  .card.seen .badge.fiber { display: inline-block; opacity: .7; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions a {
    text-decoration: none; background: var(--accent); color: #fff;
    padding: 6px 13px; border-radius: 999px; font-weight: 600; font-size: 12.5px;
  }
  .empty, .error {
    color: var(--muted); padding: 48px 0; text-align: center; font-size: 14px;
  }
  .error { color: #dc2626; }

  .empty-state {
    text-align: center; padding: 38px 20px 30px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .empty-state .icon { font-size: 34px; line-height: 1; margin-bottom: 10px; }
  .empty-state .title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty-state .text { font-size: 13.5px; color: var(--muted); max-width: 420px; margin: 0 auto; }
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px;
  }
  .suggestion-chip {
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--accent);
    border-radius: 999px; padding: 7px 14px;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .suggestion-chip:hover { border-color: var(--accent); background: var(--card); }

  .steps {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    max-width: 620px; margin: 22px auto 0;
  }
  .steps .step {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 16px 12px; text-align: center;
  }
  .steps .step .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 999px; margin-bottom: 8px;
    background: var(--accent); color: #fff; font-size: 11.5px; font-weight: 700;
  }
  .steps .step .t { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  @media (max-width: 560px) {
    .steps { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="auth-bar">
      <div id="gSignInBtn"></div>
      <div class="auth-user" id="authUser" hidden>
        <img id="authPic" alt="" referrerpolicy="no-referrer">
        <span class="name" id="authName"></span>
        <button type="button" id="authLogout">Вийти</button>
      </div>
    </div>
    <h1>Дошка оголошень нерухомості</h1>
    <form class="chat-bar" id="chatForm">
      <input type="text" id="chatInput" placeholder="напр. квартира в Антверпені до 700€, за останні 2 дні" autocomplete="off">
      <button type="submit">🔍 Шукати</button>
    </form>
    <div class="chat-reply" id="chatReply" hidden></div>
  </div>
</header>

<div class="wrap">
  <div class="bar" id="bar" hidden>
    <span class="count" id="count"></span>
    <div class="bar-actions">
      <button id="filterBtn">Тільки непереглянуті</button>
      <button id="markAllBtn">Позначити всі переглянутими</button>
      <button id="resetSeenBtn">↺ Скинути переглянуте</button>
    </div>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="error" id="error" hidden></div>
</div>

<!-- Без async/defer навмисно: має завантажитись і виконатись ДО
     нашого коду нижче, щоб об'єкт `google` вже існував, коли ми
     викликаємо google.accounts.id.initialize(...) в initGoogleAuth(). -->
<script src="https://accounts.google.com/gsi/client"></script>
<script>
"use strict";

var STORE_KEY = "reab:opened";        // { uid: ISO-час коли позначено }
var DATA = null;
var onlyUnseen = false;
// Якщо дошку відкрито за посиланням з листа (?since=...), показуємо
// лише оголошення саме з цього листа (нові за останні ~6 год), а не
// всю історію. Переглянуті серед них лишаються видимими, просто сіріють.
var sinceFilter = new URLSearchParams(location.search).get("since");

// Що зараз показано в основному списку:
//  "empty"  — сторінку щойно відкрито без ?since= і без пошуку в чаті — порожньо
//  "since"  — відкрито за посиланням з листа — показуємо нові з того запуску
//  "search" — щойно виконали пошук у чаті — показуємо його результати
var mode = "empty";
var searchResults = [];

function loadOpened() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveOpened(map) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(map)); } catch (e) {}
}
function isSeen(uid) { return Object.prototype.hasOwnProperty.call(loadOpened(), uid); }
function setSeen(uid, seen) {
  var map = loadOpened();
  if (seen) map[uid] = new Date().toISOString();
  else delete map[uid];
  saveOpened(map);
}

function fmtPrice(p, cur, extraCosts) {
  if (p == null) return "ціна не вказана";
  var unit = cur === "EUR" ? "€" : (cur || "");
  var s = Math.round(p).toLocaleString("uk-UA").replace(/,/g, " ") + " " + unit;
  if (extraCosts) {
    s += " (+" + Math.round(extraCosts).toLocaleString("uk-UA").replace(/,/g, " ") + " " + unit + ")";
  }
  return s;
}
function fmtWhen(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return "";
  var days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return "побачено сьогодні";
  if (days === 1) return "побачено вчора";
  return "побачено " + days + " дн. тому";
}
function siteLabel(url) {
  if (url.indexOf("zimmo.be") !== -1) return "Zimmo";
  if (url.indexOf("immoweb.be") !== -1) return "Immoweb";
  return "сайті";
}
function metaLine(l) {
  var bits = [];
  if (l.bedrooms != null) bits.push(l.bedrooms + " спалень");
  if (l.living_area) bits.push(Math.round(l.living_area) + " м²");
  var addr = [l.street, l.house_number].filter(Boolean).join(" ");
  var place = [l.postal_code, l.locality].filter(Boolean).join(" ");
  var full = [addr, place].filter(Boolean).join(", ");
  if (full) bits.push(full);
  return bits.join(" · ");
}

function buildCard(l, onChange) {
  // onChange — необов'язковий колбек: викликається після зміни позначки
  // "переглянуто" на цій картці (основний список перемальовує себе,
  // а картки в чаті просто оновлюють свій вигляд на місці).
  var seen = isSeen(l.uid);
  var card = document.createElement("div");
  card.className = "card" + (seen ? " seen" : "");

  if (l.photo_url) {
    var thumb = document.createElement("a");
    thumb.className = "thumb";
    thumb.href = l.url;
    thumb.target = "_blank";
    thumb.rel = "noopener";
    thumb.addEventListener("click", function () {
      setSeen(l.uid, true);
      if (onChange) setTimeout(onChange, 50);
    });
    var img = document.createElement("img");
    img.src = l.photo_url;
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", function () { thumb.remove(); });
    thumb.appendChild(img);
    card.appendChild(thumb);
  }

  var body = document.createElement("div");
  body.className = "body";

  var top = document.createElement("div");
  top.className = "top";
  var title = document.createElement("div");
  title.className = "title";
  title.textContent = l.title || "Оголошення";
  var badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = "нове";
  title.appendChild(badge);
  if (l.fiber_available === true) {
    var fiber = document.createElement("span");
    fiber.className = "badge fiber";
    fiber.textContent = "⚡ оптика Proximus";
    title.appendChild(fiber);
  }
  var price = document.createElement("div");
  price.className = "price";
  price.textContent = fmtPrice(l.price, l.currency, l.extra_costs);
  top.appendChild(title);
  top.appendChild(price);

  var meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = metaLine(l);

  var when = document.createElement("div");
  when.className = "when";
  when.textContent = fmtWhen(l.first_seen_utc);

  var alsoOn = null;
  if (l.also_on && l.also_on.length) {
    alsoOn = document.createElement("div");
    alsoOn.className = "also-on";
    alsoOn.appendChild(document.createTextNode("Також на: "));
    l.also_on.forEach(function (o, i) {
      if (i > 0) alsoOn.appendChild(document.createTextNode(", "));
      var a = document.createElement("a");
      a.href = o.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = siteLabel(o.url);
      alsoOn.appendChild(a);
    });
  }

  var actions = document.createElement("div");
  actions.className = "actions";
  var open = document.createElement("a");
  open.href = l.url;
  open.target = "_blank";
  open.rel = "noopener";
  open.textContent = "Відкрити на " + siteLabel(l.url);
  open.addEventListener("click", function () {
    setSeen(l.uid, true);
    if (onChange) setTimeout(onChange, 50);
  });
  var toggle = document.createElement("button");
  toggle.textContent = seen ? "Повернути в нові" : "Позначити переглянутим";
  toggle.addEventListener("click", function () {
    setSeen(l.uid, !seen);
    if (onChange) onChange();
  });
  actions.appendChild(open);
  actions.appendChild(toggle);

  body.appendChild(top);
  if (meta.textContent) body.appendChild(meta);
  body.appendChild(when);
  if (alsoOn) body.appendChild(alsoOn);
  body.appendChild(actions);
  card.appendChild(body);
  return card;
}

function currentBase() {
  if (mode === "search") return searchResults;
  if (mode === "since") {
    return DATA.listings.filter(function (l) { return l.first_seen_utc >= sinceFilter; });
  }
  return [];
}

function render() {
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var bar = document.getElementById("bar");
  list.innerHTML = "";

  var base = currentBase();
  var items = base.filter(function (l) {
    return onlyUnseen ? !isSeen(l.uid) : true;
  });

  bar.hidden = mode === "empty";
  if (mode !== "empty") {
    document.getElementById("count").textContent =
      base.length + " оголошень, непереглянутих: " +
      base.filter(function (l) { return !isSeen(l.uid); }).length;
  }

  empty.hidden = items.length !== 0;
  if (empty.hidden) {
    // порожній блок не показано — нічого будувати
  } else if (mode === "since") {
    empty.innerHTML = "";
    empty.appendChild(buildEmptyState("📭", "Нових оголошень немає", "Із цього запуску нічого нового не знайшлось.", []));
  } else if (mode === "search") {
    empty.innerHTML = "";
    empty.appendChild(buildEmptyState("🔍", "Нічого не знайдено", "Спробуй змінити критерії запиту — інше місто, вищу ціну або менше кімнат.", []));
  } else {
    empty.innerHTML = "";
    empty.appendChild(buildEmptyState(
      "🏠",
      "Почни з пошуку",
      "Напиши запит у рядок пошуку вгорі — можна будь-яке місто чи район у Бельгії. AI перевірить Immoweb і Zimmo та за кілька секунд покаже результати прямо тут.",
      SUGGESTIONS
    ));
    empty.appendChild(buildStepsRow());
  }

  items.forEach(function (l) {
    list.appendChild(buildCard(l, render));
  });
}

var SUGGESTIONS = [
  "квартира в Генті до 800€",
  "будинок в Антверпені, 3 спальні",
  "квартира в Мерксемі за останні 3 дні",
  "від 60 м² у Кортрейку до 900€"
];

function buildEmptyState(icon, title, text, suggestions) {
  var box = document.createElement("div");
  box.className = "empty-state";

  var iconEl = document.createElement("div");
  iconEl.className = "icon";
  iconEl.textContent = icon;
  box.appendChild(iconEl);

  var titleEl = document.createElement("div");
  titleEl.className = "title";
  titleEl.textContent = title;
  box.appendChild(titleEl);

  var textEl = document.createElement("div");
  textEl.className = "text";
  textEl.textContent = text;
  box.appendChild(textEl);

  if (suggestions && suggestions.length) {
    var chips = document.createElement("div");
    chips.className = "suggestions";
    suggestions.forEach(function (s) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "suggestion-chip";
      chip.textContent = s;
      chip.addEventListener("click", function () {
        document.getElementById("chatInput").value = s;
        sendChatMessage(s);
      });
      chips.appendChild(chip);
    });
    box.appendChild(chips);
  }

  return box;
}

function buildStepsRow() {
  var steps = [
    "Пишеш у пошук, що шукаєш — місто, ціну, кількість спалень",
    "AI перевіряє Immoweb і Zimmo та одразу показує знайдене",
    "Результати з'являються тут же — фото, ціна, посилання"
  ];
  var row = document.createElement("div");
  row.className = "steps";
  steps.forEach(function (text, i) {
    var step = document.createElement("div");
    step.className = "step";
    var n = document.createElement("div");
    n.className = "n";
    n.textContent = String(i + 1);
    var t = document.createElement("div");
    t.className = "t";
    t.textContent = text;
    step.appendChild(n);
    step.appendChild(t);
    row.appendChild(step);
  });
  return row;
}

// ---------- Вхід через Google -------------------------------------------

// Client ID застосунку в Google Cloud Console — це не секрет, його
// нормально тримати прямо тут. Заповнюється один раз після реєстрації
// застосунку (див. SETUP-SERVER.md). Поки порожній — кнопка входу
// просто не з'явиться, решта сторінки працює як і раніше.
var GOOGLE_CLIENT_ID = "810718646832-otce2khredrh1t6r241fq878cs5bsknt.apps.googleusercontent.com";

var AUTH_STORE_KEY = "reab:google-user";

function loadAuthUser() {
  try { return JSON.parse(localStorage.getItem(AUTH_STORE_KEY)); } catch (e) { return null; }
}
function saveAuthUser(user) {
  try {
    if (user) localStorage.setItem(AUTH_STORE_KEY, JSON.stringify(user));
    else localStorage.removeItem(AUTH_STORE_KEY);
  } catch (e) {}
}

function showAuthUser(user) {
  var btn = document.getElementById("gSignInBtn");
  var box = document.getElementById("authUser");
  if (user) {
    btn.hidden = true;
    box.hidden = false;
    document.getElementById("authPic").src = user.picture || "";
    document.getElementById("authName").textContent = user.name || user.email;
  } else {
    box.hidden = true;
    btn.hidden = !GOOGLE_CLIENT_ID;
  }
}

function onGoogleCredential(response) {
  fetch(AUTH_BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id_token: response.credential }),
  })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (user) {
      saveAuthUser(user);
      showAuthUser(user);
    })
    .catch(function () {
      // Не вдалось підтвердити вхід на сервері — просто лишаємось
      // не залогіненими, нічого критичного для решти сторінки.
    });
}

function initGoogleAuth() {
  showAuthUser(loadAuthUser());

  document.getElementById("authLogout").addEventListener("click", function () {
    saveAuthUser(null);
    showAuthUser(null);
    if (typeof google !== "undefined") google.accounts.id.disableAutoSelect();
  });

  if (!GOOGLE_CLIENT_ID || typeof google === "undefined") return;

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: onGoogleCredential,
    auto_select: false,
  });
  google.accounts.id.renderButton(
    document.getElementById("gSignInBtn"),
    { theme: "outline", size: "medium", text: "signin", shape: "pill" }
  );
}

// ---------- AI-чат ----------------------------------------------------

// Адреса твого сервера з server/app.py (Render). Заповнюється один раз
// після деплою — див. SETUP-SERVER.md. Без цього чат просто покаже
// повідомлення "чат ще не налаштовано".
var CHAT_BACKEND_URL = "https://real-estate-aggregator-gmes.onrender.com/api/chat";

// Той самий сервер перевіряє вхід через Google — /api/auth/google поруч з /api/chat.
var AUTH_BACKEND_URL = CHAT_BACKEND_URL.replace("/api/chat", "/api/auth/google");

var CHAT_CODE_KEY = "reab:chat-access-code";
var chatHistory = [];

function getChatAccessCode() {
  try { return localStorage.getItem(CHAT_CODE_KEY) || ""; } catch (e) { return ""; }
}
function setChatAccessCode(code) {
  try { localStorage.setItem(CHAT_CODE_KEY, code); } catch (e) {}
}

function showChatReply(text, isError) {
  var el = document.getElementById("chatReply");
  el.textContent = text;
  el.hidden = !text;
  el.classList.toggle("error", !!isError);
}

function sendChatMessage(text) {
  if (!CHAT_BACKEND_URL) {
    showChatReply("Чат ще не налаштовано — див. SETUP-SERVER.md (треба вписати адресу сервера у CHAT_BACKEND_URL).", true);
    return;
  }

  var code = getChatAccessCode();
  if (!code) {
    code = (prompt("Введи код доступу до AI-пошуку:") || "").trim();
    if (!code) return;
    setChatAccessCode(code);
  }

  showChatReply("Шукаю…");

  fetch(CHAT_BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Access-Code": code },
    body: JSON.stringify({ message: text, history: chatHistory }),
  })
    .then(function (r) {
      if (r.status === 401) {
        setChatAccessCode("");
        throw new Error("Неправильний код доступу. Спробуй ще раз — запитаємо його знову.");
      }
      if (!r.ok) throw new Error("Сервер відповів помилкою (" + r.status + ").");
      return r.json();
    })
    .then(function (data) {
      var reply = data.reply || "…";
      showChatReply(reply);
      chatHistory.push({ role: "user", content: text });
      chatHistory.push({ role: "assistant", content: reply });
      mode = "search";
      searchResults = data.listings || [];
      render();
    })
    .catch(function (e) {
      showChatReply(
        "Не вдалося зв'язатись із сервером: " + e.message +
          " Якщо сервер довго не використовувався, спробуй ще раз за хвилину — він міг щойно 'прокидатись'.",
        true
      );
    });
}

function initChat() {
  var form = document.getElementById("chatForm");
  var input = document.getElementById("chatInput");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendChatMessage(text);
  });
}

function init(data) {
  DATA = data;
  if (sinceFilter) mode = "since";

  document.getElementById("filterBtn").addEventListener("click", function () {
    onlyUnseen = !onlyUnseen;
    this.classList.toggle("on", onlyUnseen);
    this.textContent = onlyUnseen ? "Показано: тільки нові" : "Тільки непереглянуті";
    render();
  });
  document.getElementById("markAllBtn").addEventListener("click", function () {
    if (!confirm("Позначити всі оголошення як переглянуті?")) return;
    var map = loadOpened();
    DATA.listings.forEach(function (l) {
      if (!map[l.uid]) map[l.uid] = new Date().toISOString();
    });
    saveOpened(map);
    render();
  });
  document.getElementById("resetSeenBtn").addEventListener("click", function () {
    if (!confirm("Скинути позначки «переглянуто» для всіх оголошень у цьому браузері?")) return;
    saveOpened({});
    render();
  });

  render();
}

initChat();
initGoogleAuth();

fetch("data.json?" + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(init)
  .catch(function (e) {
    var err = document.getElementById("error");
    err.hidden = false;
    err.textContent = "Не вдалося завантажити список (data.json): " + e.message +
      ". Якщо сторінку щойно ввімкнено — зачекайте перший запуск програми.";
  });
</script>

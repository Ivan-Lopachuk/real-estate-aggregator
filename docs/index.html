<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дошка оголошень нерухомості</title>
<style>
  :root {
    --bg: #eef0f6;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b6b80;
    --border: #e1e2ec;
    --accent: #4338ca;
    --accent-2: #2563eb;
    --hero-fg: #ffffff;
    --new-bg: #dcfce7;
    --new-fg: #15803d;
    --fiber-bg: #dbeafe;
    --fiber-fg: #1d4ed8;
    --shadow: 0 1px 2px rgba(23,23,55,.04), 0 4px 14px rgba(23,23,55,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101018;
      --card: #1a1a26;
      --text: #f1f1f6;
      --muted: #9797ad;
      --border: #2c2c3c;
      --accent: #818cf8;
      --accent-2: #60a5fa;
      --hero-fg: #ffffff;
      --new-bg: rgba(34,197,94,.16);
      --new-fg: #4ade80;
      --fiber-bg: rgba(96,165,250,.16);
      --fiber-fg: #93c5fd;
      --shadow: 0 4px 14px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    padding: 32px 16px 28px;
  }
  .hero-inner { max-width: 780px; margin: 0 auto; text-align: center; }
  .hero h1 {
    color: var(--hero-fg); font-size: 27px; font-weight: 800;
    letter-spacing: -.02em; line-height: 1.25; margin: 0 0 8px;
    text-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  .hero .sub {
    color: rgba(255,255,255,.92); font-size: 13.5px; font-weight: 500;
    line-height: 1.6; margin: 0;
  }
  .hero .sub code {
    background: rgba(255,255,255,.22); color: #fff;
    padding: 2px 7px; border-radius: 5px; font-size: 12.5px; font-weight: 600;
  }

  .page {
    display: flex; align-items: flex-start; gap: 20px;
    max-width: 1120px; margin: 0 auto; padding: 16px 16px 60px;
  }
  .wrap { flex: 1 1 480px; min-width: 0; max-width: 780px; padding: 0; }

  .chat-panel {
    flex: 0 0 320px; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden;
    position: sticky; top: 16px; height: calc(100vh - 32px); max-height: 720px;
  }
  .chat-panel h2 {
    margin: 0; padding: 12px 14px; font-size: 14px; font-weight: 700;
    border-bottom: 1px solid var(--border); flex: none;
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .chat-msg {
    font-size: 13px; line-height: 1.5; padding: 8px 11px; border-radius: 12px;
    max-width: 92%; white-space: pre-wrap;
  }
  .chat-msg-user {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 3px;
  }
  .chat-msg-assistant {
    align-self: flex-start; background: var(--bg); color: var(--text);
    border-bottom-left-radius: 3px;
  }
  .chat-msg-pending { opacity: .6; }
  .chat-results { display: flex; flex-direction: column; gap: 8px; }
  .chat-results .card { margin-bottom: 0; }
  .chat-form {
    display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--border); flex: none;
  }
  .chat-form input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 12px; background: var(--bg); color: var(--text);
  }
  .chat-form button {
    flex: none; background: var(--accent); color: #fff; border-color: var(--accent);
  }
  @media (max-width: 860px) {
    .page { flex-direction: column; }
    .chat-panel {
      flex: none; width: 100%; height: 380px; max-height: none;
      position: static; order: -1;
    }
    .wrap { max-width: none; }
  }

  .bar { margin: 14px 0 16px; }
  .bar .count { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .bar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .link-btn {
    font: inherit; font-size: 13px; font-weight: 600; line-height: 1.4; cursor: pointer;
    box-sizing: border-box; -webkit-appearance: none; appearance: none;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    text-decoration: none; display: inline-flex; align-items: center;
    padding: 6px 13px; border-radius: 999px; margin: 0;
    transition: border-color .15s ease, color .15s ease, background-color .15s ease;
  }
  button:hover, .link-btn:hover { border-color: var(--accent); color: var(--accent); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:active, .link-btn:active { transform: translateY(1px); }

  .card {
    display: flex; align-items: stretch;
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px; margin-bottom: 10px;
    box-shadow: var(--shadow); overflow: hidden;
    transition: border-color .15s ease, opacity .15s ease, transform .15s ease;
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-1px); }
  }
  .card.seen { opacity: .55; border-left-color: var(--border); }
  .card .thumb {
    flex: 0 0 100px; width: 100px; background: var(--border);
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { flex: 1; min-width: 0; padding: 12px 14px; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .card .title { font-weight: 600; font-size: 14px; }
  .card .price { white-space: nowrap; font-weight: 700; font-size: 14px; color: var(--accent); }
  .card .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .card .when { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .card .also-on { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .card .also-on a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .card .also-on a:hover { text-decoration: underline; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .01em;
    background: var(--new-bg); color: var(--new-fg);
    border-radius: 999px; padding: 2px 7px; margin-left: 6px;
    vertical-align: middle; line-height: 1.3;
  }
  .card.seen .badge { display: none; }
  .badge.fiber { background: var(--fiber-bg); color: var(--fiber-fg); }
  .card.seen .badge.fiber { display: inline-block; opacity: .7; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions a {
    text-decoration: none; background: var(--accent); color: #fff;
    padding: 6px 13px; border-radius: 999px; font-weight: 600; font-size: 12.5px;
  }
  .empty, .error {
    color: var(--muted); padding: 48px 0; text-align: center; font-size: 14px;
  }
  .error { color: #dc2626; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <h1>Дошка оголошень нерухомості</h1>
    <div class="sub" id="sub">Завантаження…</div>
  </div>
</header>
<div class="page">
  <aside class="chat-panel" id="chatPanel">
    <h2>🤖 AI-пошук</h2>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-form" id="chatForm">
      <input type="text" id="chatInput" placeholder="напр. квартира в Антверпені до 700€" autocomplete="off">
      <button type="submit">➤</button>
    </form>
  </aside>

  <div class="wrap">
    <div class="bar" id="bar" hidden>
      <span class="count" id="count"></span>
      <div class="bar-actions">
        <button id="filterBtn">Тільки непереглянуті</button>
        <button id="markAllBtn">Позначити всі переглянутими</button>
        <button id="resetSeenBtn">↺ Скинути переглянуте</button>
        <a id="criteriaLink" class="link-btn" target="_blank" rel="noopener" hidden>⚙ Змінити критерії</a>
      </div>
    </div>

    <div id="list"></div>
    <div class="empty" id="empty" hidden>Немає оголошень для показу.</div>
    <div class="error" id="error" hidden></div>
  </div>
</div>

<script>
"use strict";

var STORE_KEY = "reab:opened";        // { uid: ISO-час коли позначено }
var DATA = null;
var onlyUnseen = false;
// Якщо дошку відкрито за посиланням з листа (?since=...), показуємо
// лише оголошення саме з цього листа (нові за останні ~6 год), а не
// всю історію. Переглянуті серед них лишаються видимими, просто сіріють.
var sinceFilter = new URLSearchParams(location.search).get("since");

function loadOpened() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveOpened(map) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(map)); } catch (e) {}
}
function isSeen(uid) { return Object.prototype.hasOwnProperty.call(loadOpened(), uid); }
function setSeen(uid, seen) {
  var map = loadOpened();
  if (seen) map[uid] = new Date().toISOString();
  else delete map[uid];
  saveOpened(map);
}

function fmtPrice(p, cur, extraCosts) {
  if (p == null) return "ціна не вказана";
  var unit = cur === "EUR" ? "€" : (cur || "");
  var s = Math.round(p).toLocaleString("uk-UA").replace(/,/g, " ") + " " + unit;
  if (extraCosts) {
    s += " (+" + Math.round(extraCosts).toLocaleString("uk-UA").replace(/,/g, " ") + " " + unit + ")";
  }
  return s;
}
function fmtWhen(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return "";
  var days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return "побачено сьогодні";
  if (days === 1) return "побачено вчора";
  return "побачено " + days + " дн. тому";
}
function siteLabel(url) {
  if (url.indexOf("zimmo.be") !== -1) return "Zimmo";
  if (url.indexOf("immoweb.be") !== -1) return "Immoweb";
  return "сайті";
}
function metaLine(l) {
  var bits = [];
  if (l.bedrooms != null) bits.push(l.bedrooms + " спалень");
  if (l.living_area) bits.push(Math.round(l.living_area) + " м²");
  var addr = [l.street, l.house_number].filter(Boolean).join(" ");
  var place = [l.postal_code, l.locality].filter(Boolean).join(" ");
  var full = [addr, place].filter(Boolean).join(", ");
  if (full) bits.push(full);
  return bits.join(" · ");
}

function buildCard(l, onChange) {
  // onChange — необов'язковий колбек: викликається після зміни позначки
  // "переглянуто" на цій картці (основний список перемальовує себе,
  // а картки в чаті просто оновлюють свій вигляд на місці).
  var seen = isSeen(l.uid);
  var card = document.createElement("div");
  card.className = "card" + (seen ? " seen" : "");

  if (l.photo_url) {
    var thumb = document.createElement("a");
    thumb.className = "thumb";
    thumb.href = l.url;
    thumb.target = "_blank";
    thumb.rel = "noopener";
    thumb.addEventListener("click", function () {
      setSeen(l.uid, true);
      if (onChange) setTimeout(onChange, 50);
    });
    var img = document.createElement("img");
    img.src = l.photo_url;
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", function () { thumb.remove(); });
    thumb.appendChild(img);
    card.appendChild(thumb);
  }

  var body = document.createElement("div");
  body.className = "body";

  var top = document.createElement("div");
  top.className = "top";
  var title = document.createElement("div");
  title.className = "title";
  title.textContent = l.title || "Оголошення";
  var badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = "нове";
  title.appendChild(badge);
  if (l.fiber_available === true) {
    var fiber = document.createElement("span");
    fiber.className = "badge fiber";
    fiber.textContent = "⚡ оптика Proximus";
    title.appendChild(fiber);
  }
  var price = document.createElement("div");
  price.className = "price";
  price.textContent = fmtPrice(l.price, l.currency, l.extra_costs);
  top.appendChild(title);
  top.appendChild(price);

  var meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = metaLine(l);

  var when = document.createElement("div");
  when.className = "when";
  when.textContent = fmtWhen(l.first_seen_utc);

  var alsoOn = null;
  if (l.also_on && l.also_on.length) {
    alsoOn = document.createElement("div");
    alsoOn.className = "also-on";
    alsoOn.appendChild(document.createTextNode("Також на: "));
    l.also_on.forEach(function (o, i) {
      if (i > 0) alsoOn.appendChild(document.createTextNode(", "));
      var a = document.createElement("a");
      a.href = o.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = siteLabel(o.url);
      alsoOn.appendChild(a);
    });
  }

  var actions = document.createElement("div");
  actions.className = "actions";
  var open = document.createElement("a");
  open.href = l.url;
  open.target = "_blank";
  open.rel = "noopener";
  open.textContent = "Відкрити на " + siteLabel(l.url);
  open.addEventListener("click", function () {
    setSeen(l.uid, true);
    if (onChange) setTimeout(onChange, 50);
  });
  var toggle = document.createElement("button");
  toggle.textContent = seen ? "Повернути в нові" : "Позначити переглянутим";
  toggle.addEventListener("click", function () {
    setSeen(l.uid, !seen);
    if (onChange) onChange();
  });
  actions.appendChild(open);
  actions.appendChild(toggle);

  body.appendChild(top);
  if (meta.textContent) body.appendChild(meta);
  body.appendChild(when);
  if (alsoOn) body.appendChild(alsoOn);
  body.appendChild(actions);
  card.appendChild(body);
  return card;
}

function render() {
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  list.innerHTML = "";

  var base = sinceFilter
    ? DATA.listings.filter(function (l) { return l.first_seen_utc >= sinceFilter; })
    : DATA.listings;

  var items = base.filter(function (l) {
    return onlyUnseen ? !isSeen(l.uid) : true;
  });

  document.getElementById("count").textContent =
    base.length + " оголошень, непереглянутих: " +
    base.filter(function (l) { return !isSeen(l.uid); }).length;

  empty.hidden = items.length !== 0;
  empty.textContent = sinceFilter
    ? "Нових оголошень із цього запуску немає."
    : "Немає оголошень для показу.";

  items.forEach(function (l) {
    list.appendChild(buildCard(l, render));
  });
}

// ---------- AI-чат ----------------------------------------------------

// Адреса твого сервера з server/app.py (Render). Заповнюється один раз
// після деплою — див. SETUP-SERVER.md. Без цього чат просто покаже
// повідомлення "чат ще не налаштовано".
var CHAT_BACKEND_URL = "https://real-estate-aggregator-gmes.onrender.com";

var CHAT_CODE_KEY = "reab:chat-access-code";
var chatHistory = [];

function getChatAccessCode() {
  try { return localStorage.getItem(CHAT_CODE_KEY) || ""; } catch (e) { return ""; }
}
function setChatAccessCode(code) {
  try { localStorage.setItem(CHAT_CODE_KEY, code); } catch (e) {}
}

function appendChatText(role, text) {
  var messages = document.getElementById("chatMessages");
  var el = document.createElement("div");
  el.className = "chat-msg chat-msg-" + role;
  el.textContent = text;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

function appendChatResults(listings) {
  if (!listings || !listings.length) return;
  var messages = document.getElementById("chatMessages");
  var wrap = document.createElement("div");
  wrap.className = "chat-results";
  listings.forEach(function (l) {
    wrap.appendChild(buildCard(l, function () {}));
  });
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
}

function sendChatMessage(text) {
  if (!CHAT_BACKEND_URL) {
    appendChatText("assistant", "Чат ще не налаштовано — див. SETUP-SERVER.md (треба вписати адресу сервера у CHAT_BACKEND_URL).");
    return;
  }

  var code = getChatAccessCode();
  if (!code) {
    code = (prompt("Введи код доступу до AI-пошуку:") || "").trim();
    if (!code) return;
    setChatAccessCode(code);
  }

  appendChatText("user", text);
  var pending = appendChatText("assistant", "…");
  pending.classList.add("chat-msg-pending");

  fetch(CHAT_BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Access-Code": code },
    body: JSON.stringify({ message: text, history: chatHistory }),
  })
    .then(function (r) {
      if (r.status === 401) {
        setChatAccessCode("");
        throw new Error("Неправильний код доступу. Спробуй ще раз — запитаємо його знову.");
      }
      if (!r.ok) throw new Error("Сервер відповів помилкою (" + r.status + ").");
      return r.json();
    })
    .then(function (data) {
      pending.remove();
      var reply = data.reply || "…";
      appendChatText("assistant", reply);
      chatHistory.push({ role: "user", content: text });
      chatHistory.push({ role: "assistant", content: reply });
      appendChatResults(data.listings);
    })
    .catch(function (e) {
      pending.remove();
      appendChatText(
        "assistant",
        "Не вдалося зв'язатись із сервером: " + e.message +
          " Якщо сервер довго не використовувався, спробуй ще раз за хвилину — він міг щойно 'прокидатись'."
      );
    });
}

function initChat() {
  var form = document.getElementById("chatForm");
  var input = document.getElementById("chatInput");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendChatMessage(text);
  });
}

function githubActionsUrl() {
  // Дошка сама живе на "<логін>.github.io/<репозиторій>/" (GitHub
  // Pages), тож адресу форми зміни критеріїв можна вивести з адреси
  // самої сторінки — окремо нічого налаштовувати не треба.
  var host = location.hostname;
  if (host.indexOf(".github.io") === -1) return null;
  var owner = host.split(".")[0];
  var repo = location.pathname.split("/").filter(Boolean)[0];
  if (!owner || !repo) return null;
  return "https://github.com/" + owner + "/" + repo + "/actions/workflows/check.yml";
}

function init(data) {
  DATA = data;
  var checked = new Date(data.generated_utc);
  document.getElementById("sub").innerHTML =
    "Критерії: <code>" + (data.search_summary || "—") + "</code><br>" +
    "Остання перевірка: " + (isNaN(checked) ? "?" : checked.toLocaleString("uk-UA"));
  document.getElementById("bar").hidden = false;

  var criteriaUrl = githubActionsUrl();
  if (criteriaUrl) {
    var criteriaLink = document.getElementById("criteriaLink");
    criteriaLink.href = criteriaUrl;
    criteriaLink.hidden = false;
  }

  document.getElementById("filterBtn").addEventListener("click", function () {
    onlyUnseen = !onlyUnseen;
    this.classList.toggle("on", onlyUnseen);
    this.textContent = onlyUnseen ? "Показано: тільки нові" : "Тільки непереглянуті";
    render();
  });
  document.getElementById("markAllBtn").addEventListener("click", function () {
    if (!confirm("Позначити всі оголошення як переглянуті?")) return;
    var map = loadOpened();
    DATA.listings.forEach(function (l) {
      if (!map[l.uid]) map[l.uid] = new Date().toISOString();
    });
    saveOpened(map);
    render();
  });
  document.getElementById("resetSeenBtn").addEventListener("click", function () {
    if (!confirm("Скинути позначки «переглянуто» для всіх оголошень у цьому браузері?")) return;
    saveOpened({});
    render();
  });

  render();
}

initChat();

fetch("data.json?" + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(init)
  .catch(function (e) {
    document.getElementById("sub").textContent = "";
    var err = document.getElementById("error");
    err.hidden = false;
    err.textContent = "Не вдалося завантажити список (data.json): " + e.message +
      ". Якщо сторінку щойно ввімкнено — зачекайте перший запуск програми.";
  });
</script>
</body>
</html>

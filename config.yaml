# ============================================================
#  Real Estate Aggregator — файл налаштувань
#
#  Редагуйте значення нижче. Знати Python НЕ потрібно.
#  Після зміни цього файлу просто запустіть програму знову:
#      python main.py
#
#  Правила синтаксису YAML:
#    * відступи робляться ПРОБІЛАМИ (не Tab), по 2 пробіли;
#    * список — це рядки, що починаються з "- ";
#    * текст із цифр (поштові індекси) беріть у лапки: "9000";
#    * "null" означає «без обмеження» / «не задано».
# ============================================================

# Які сайти опитувати. Кожна назва має відповідати модулю-scraper
# у теці aggregator/scrapers/. Доступні: immoweb, immovlan
#
# Zimmo й Logic-Immo (той самий сайт після 2023 — logic-immo.be
# перенаправляє на zimmo.be) сюди свідомо не входять: сторінка пошуку
# Zimmo блокує запити з хмарних серверів GitHub Actions (403 Forbidden),
# обхід платний (проксі-сервіс). Immovlan такого захисту не має.
sites:
  - immoweb
  - immovlan

# ----- Що саме шукаємо ---------------------------------------
search:
  # "sale" — купівля, "rent" — оренда
  transaction: rent

  # Типи житла. Можливі варіанти: house, apartment
  property_types:
    - house
    - apartment

  # Діапазон ціни в євро. null = без обмеження.
  price_min: 600
  price_max: 800

  # Кількість спалень. null = без обмеження.
  bedrooms_min: 1
  bedrooms_max: 1

  # Мінімальна житлова площа в м². null = без обмеження.
  living_area_min: 35

  # Бельгійські поштові індекси (як текст, у лапках).
  # Залиште список порожнім (postal_codes: []), щоб шукати по всій країні.
  postal_codes:
    - "9000"   # Gent
    - "8500"   # Kortrijk

  # Необов'язково: залишати лише оголошення, у назві населеного пункту
  # яких є одне зі слів нижче (регістр не важливий). [] = не фільтрувати.
  # Якщо заповнено — ці назви показуються в короткому описі критеріїв
  # (лист, дошка) ЗАМІСТЬ поштових індексів.
  localities:
    - "Gent"
    - "Kortrijk"

# ----- Як часто перевіряти (діє лише із прапорцем --loop) -----
poll:
  interval_minutes: 360

# ----- Де зберігаються знайдені оголошення --------------------
database:
  path: listings.db

# ----- Мережеві налаштування ---------------------------------
http:
  # Пауза між запитами сторінок у секундах (щоб бути ввічливим до сайту).
  request_delay_seconds: 1.0
  # Запобіжник: максимум сторінок за один прохід.
  max_pages: 10
  timeout_seconds: 20

# ----- Сповіщення -------------------------------------------
notifications:
  # console = лише вивід у термінал
  # email   = надіслати лист
  # both    = і те, і те
  method: console

  # Заповніть цей блок, лише якщо method = email або both.
  # Нижче — налаштування для пошти ukr.net.
  email:
    smtp_host: smtp.ukr.net
    smtp_port: 465
    use_ssl: true        # ukr.net: одразу зашифроване з'єднання (порт 465)
    use_tls: false       # STARTTLS не використовується

    # Адреса пошти та пароль у цьому файлі НЕ пишуться — бо репозиторій
    # публічний (потрібно для веб-дошки). Програма бере їх зі змінних
    # середовища / файлу .env (локально) або з "секретів" GitHub (у хмарі):
    #   AGGREGATOR_SMTP_USERNAME  — твоя адреса ukr.net (вона ж відправник)
    #   AGGREGATOR_EMAIL_TO       — куди слати (можна кілька через кому)
    #   AGGREGATOR_SMTP_PASSWORD  — пароль для зовнішніх програм ukr.net
    password_env: AGGREGATOR_SMTP_PASSWORD

# ----- Перевірка оптоволоконного інтернету (Proximus) --------
# Для кожного НОВОГО оголошення з відомою вулицею й номером будинку
# програма питає сайт proximus.be, чи є там оптика (fiber). Результат
# показується на веб-дошці. Працює лише для Бельгії; неофіційний
# механізм (може колись перестати працювати — це нормально).
fiber_check:
  enabled: true

# ----- Веб-дошка оголошень (GitHub Pages) --------------------
webpage:
  # true — після кожного проходу оновлювати docs/data.json для сторінки-дошки.
  enabled: true
  output_dir: docs
  # Публічна адреса дошки. З'явиться після увімкнення GitHub Pages —
  # тоді впиши її сюди (потрапляє посиланням у лист).
  # Приклад: https://ТВІЙ-ЛОГІН.github.io/real-estate-aggregator/
  url: "https://ivan-lopachuk.github.io/real-estate-aggregator/"
